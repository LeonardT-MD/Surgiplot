[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surgiplot"
version = "0.3.0"
description = "Coordinate-based neurosurgical morphometry for reproducible CLI, Python, and desktop workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{name = "Leonardo Tariciotti"}]
maintainers = [{name = "Surgiplot Contributors"}]
keywords = [
  "neurosurgery",
  "neuroanatomy",
  "morphometry",
  "neuronavigation",
  "computational-geometry",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
gui = [
  "matplotlib>=3.8",
  "PySide6>=6.5,<7",
  "pillow>=10",
  "psutil>=5.9",
]
scene3d = [
  "matplotlib>=3.8",
  "PySide6>=6.5,<7",
  "pillow>=10",
  "psutil>=5.9",
  "pyvista>=0.43",
  "pyvistaqt>=0.11",
  "vtk>=9.3",
]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.9",
  "twine>=5",
]

[project.urls]
Homepage = "https://github.com/LeonardT-MD/Surgiplot"
Repository = "https://github.com/LeonardT-MD/Surgiplot"
Issues = "https://github.com/LeonardT-MD/Surgiplot/issues"

[project.scripts]
surgiplot = "surgiplot.cli.app:main"
surgiplot_gui = "surgiplot.gui.app:main"
surgiplot-gui = "surgiplot.gui.app:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["surgiplot", "surgiplot.*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
